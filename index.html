    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'sans-serif'],
                    },
                    colors: {
                        tunesRed: '#FA243C',
                        tunesDark: '#0F0F12',
                        tunesSurface: '#18181C',
                        tunesCard: '#202026',
                        tunesBorder: '#2C2C34',
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        body {
            background-color: #0F0F12;
            color: #FFFFFF;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2C2C34; border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: #FA243C; }

        /* Equalizer Animation */
        @keyframes eqBar1 { 0%, 100% { height: 4px; } 50% { height: 14px; } }
        @keyframes eqBar2 { 0%, 100% { height: 14px; } 50% { height: 5px; } }
        @keyframes eqBar3 { 0%, 100% { height: 7px; } 50% { height: 15px; } }
        .eq-bar-1 { animation: eqBar1 0.7s ease-in-out infinite; }
        .eq-bar-2 { animation: eqBar2 0.55s ease-in-out infinite; }
        .eq-bar-3 { animation: eqBar3 0.8s ease-in-out infinite; }

        /* Range Sliders */
        input[type=range].tunes-slider {
            -webkit-appearance: none;
            appearance: none;
            background: transparent;
            cursor: pointer;
        }
        input[type=range].tunes-slider::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 99px;
            background: rgba(255, 255, 255, 0.18);
        }
        input[type=range].tunes-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #FFFFFF;
            margin-top: -4px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        }

        /* Mobile Bottom Navigation Pill — Anchored at Very Bottom */
        @media (max-width: 767px) {
            #mobile-bottom-nav {
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: calc(8px + env(safe-area-inset-bottom, 0px));
                z-index: 60;
                background: rgba(28, 28, 34, 0.94);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 999px;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.75);
            }
            #player-dock.mobile-active {
                position: fixed;
                left: 12px;
                right: 12px;
                bottom: calc(74px + env(safe-area-inset-bottom, 0px));
                z-index: 55;
                border-radius: 18px;
                border: 1px solid rgba(255, 255, 255, 0.12);
                background: rgba(24, 24, 30, 0.95);
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.65);
            }
            #player-dock.mobile-hidden {
                display: none !important;
            }
        }
    </style>
</head>
